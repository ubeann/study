<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TITLE</title>
<style>
  /* T3 injects its theme as CSS variables on :root. Keep html, body and .page transparent. */
  body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); color: var(--foreground); }
  .page { display: grid; gap: 28px; width: 100%; }
  section { display: grid; gap: 10px; }
  h2 { margin: 0; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
  h2 b { color: var(--foreground); }
  p { margin: 0; font-size: 14px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { display: grid; gap: 6px; padding: 16px; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius, 8px); }
  .card h3 { margin: 0; font-size: 14px; }
  .card p { font-size: 13px; color: var(--muted-foreground); }
  .card.hot { background: var(--accent-surface); color: var(--accent-surface-foreground); border-color: var(--accent); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .step { padding: 8px 12px; font-size: 13px; background: var(--secondary); color: var(--secondary-foreground); border-radius: var(--radius, 8px); }
  .step.hot { background: var(--accent-surface); color: var(--accent-surface-foreground); }
  .arrow { color: var(--muted-foreground); }
  svg { display: block; width: 100%; height: 240px; }
  svg text { fill: var(--foreground); font: 12px var(--font-sans, system-ui, sans-serif); }
  svg .box { fill: var(--card); stroke: var(--border); }
  svg .hot { fill: var(--accent-surface); stroke: var(--accent); }
  svg .line { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; color: var(--muted-foreground); }
  .note { font-size: 12px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="page">

  <section>
    <h2>01 <b>What it is</b></h2>
    <p>One or two sentences.</p>
  </section>

  <section>
    <h2>02 <b>The usual way vs this</b></h2>
    <div class="grid">
      <div class="card"><h3>Usual way</h3><p>How it is normally done.</p></div>
      <div class="card hot"><h3>This concept</h3><p>What changes.</p></div>
    </div>
  </section>

  <section>
    <h2>03 <b>How it flows</b></h2>
    <div class="flow">
      <span class="step">step one</span><span class="arrow">&rarr;</span>
      <span class="step hot">the key step</span><span class="arrow">&rarr;</span>
      <span class="step">result</span>
    </div>
  </section>

  <section>
    <h2>04 <b>Diagram</b></h2>
    <svg viewBox="0 0 700 240" role="img" aria-label="Describe the picture in one sentence.">
      <rect class="box" x="20" y="40" width="160" height="56" rx="8"/>
      <text x="100" y="73" text-anchor="middle">Node A</text>
      <path class="line" d="M180 68 H300" marker-end="url(#a)"/>
      <rect class="hot" x="300" y="40" width="160" height="56" rx="8"/>
      <text x="380" y="73" text-anchor="middle">Node B</text>
      <defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted-foreground)"/></marker></defs>
    </svg>
  </section>

  <section>
    <h2>05 <b>When to use it</b></h2>
    <table>
      <tr><th>Use it when</th><th>Skip it when</th></tr>
      <tr><td>...</td><td>...</td></tr>
    </table>
  </section>

  <p class="note">Sources are listed in the note.</p>
</div>
</body>
</html>
